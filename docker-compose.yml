services:
  db:
    image: mariadb:lts
    container_name: inventory_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_web
    restart: always
    environment:
      - APP_HOST=0.0.0.0
    command: sh -c "python app/migrate.py --db-host db --db-user app_user --db-password app_password --db-name inventory_db && python app/main.py --port 5200 --db-host db --db-user app_user --db-password app_password --db-name inventory_db"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

  nginx:
    image: nginx:latest
    container_name: inventory_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - backend_network

volumes:
  db_data:

networks:
  backend_network:
    driver: bridge
