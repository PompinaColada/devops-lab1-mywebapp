name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-path: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Run Python Linter (flake8)
        run: flake8 app tests --max-line-length=120

      - name: Run Shell Linter (shellcheck)
        run: shellcheck deploy/deploy.sh

      - name: Run Docker Linter (hadolint)
        run: hadolint Dockerfile

      - name: Run Tests with Coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=40

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build & Push Docker Image
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/mywebapp"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "Building and pushing tag: $TAG_NAME and stable"
            docker build -t "$IMAGE_NAME:$TAG_NAME" -t "$IMAGE_NAME:stable" .
            docker push "$IMAGE_NAME:$TAG_NAME"
            docker push "$IMAGE_NAME:stable"
          else
            SHA_TAG="sha-${GITHUB_SHA::7}"
            echo "Building and pushing tag: $SHA_TAG and latest"
            docker build -t "$IMAGE_NAME:$SHA_TAG" -t "$IMAGE_NAME:latest" .
            docker push "$IMAGE_NAME:$SHA_TAG"
            docker push "$IMAGE_NAME:latest"
          fi

  deploy:
    name: Deploy Application
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Docker Image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/mywebapp"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          docker pull "$IMAGE_NAME:$TAG_NAME"

      - name: Set Environment Variables & Restart Systemd Service
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/mywebapp"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          
          sudo cp deploy/mywebapp-docker.service /etc/systemd/system/mywebapp-docker.service
          
          sudo mkdir -p /etc/mywebapp
          echo "IMAGE_NAME=$IMAGE_NAME" | sudo tee /etc/mywebapp/env
          echo "IMAGE_TAG=$TAG_NAME" | sudo tee -a /etc/mywebapp/env
          
          sudo systemctl daemon-reload
          sudo systemctl enable mywebapp-docker.service
          sudo systemctl restart mywebapp-docker.service

      - name: Verify Deployment
        run: bash deploy/verify.sh
